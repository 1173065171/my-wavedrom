[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fsdb2wave"
version = "0.1.0"
description = "Convert a bounded window of FSDB / VCD waveforms into WaveDrom WaveJSON"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = []

[project.scripts]
fsdb2wave = "fsdb2wave.cli:main"

[tool.setuptools]
packages = ["fsdb2wave"]
